"$schema" = 'https://starship.rs/config-schema.json'

# no blank line between prompts
add_newline = false

format = """
${custom.root}${custom.peach_cap}\
$directory\
${custom.git_clean}${custom.git_dirty}${custom.git_sep}\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_macchiato'

[username]
disabled = true

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# red 'root' badge when running as root (su, sudo -s, root ssh)
[custom.root]
when = '[ "$(id -u)" = "0" ]'
command = 'echo root'
format = '[](red)[ $output ](bg:red fg:crust)[](fg:red bg:peach)'

# plain peach cap when not root
[custom.peach_cap]
when = '[ "$(id -u)" != "0" ]'
command = 'true'
format = '[](peach)'

# entire git segment turns green with a checkmark when the working tree is clean
[custom.git_clean]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -z "$(git status --porcelain 2>/dev/null)"'
command = '''
b=$(git branch --show-current 2>/dev/null)
[ -n "$b" ] || b=$(git rev-parse --short HEAD 2>/dev/null)
a=$(git rev-list --count "@{upstream}..HEAD" 2>/dev/null)
r=$(git rev-list --count "HEAD..@{upstream}" 2>/dev/null)
g="✓"
[ "${a:-0}" -gt 0 ] && g="${g}⇡$a"
[ "${r:-0}" -gt 0 ] && g="${g}⇣$r"
printf '%s %s' "$b" "$g"
'''
format = '[](fg:peach bg:green)[$output ](fg:crust bg:green)[](fg:green)'

# entire git segment turns yellow with status glyphs when the working tree is dirty
[custom.git_dirty]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -n "$(git status --porcelain 2>/dev/null)"'
command = '''
b=$(git branch --show-current 2>/dev/null)
[ -n "$b" ] || b=$(git rev-parse --short HEAD 2>/dev/null)
s=$(git status --porcelain 2>/dev/null)
g=""
printf '%s\n' "$s" | grep -q '^??' && g="${g}?"
printf '%s\n' "$s" | grep -qv '^??' && g="${g}!"
a=$(git rev-list --count "@{upstream}..HEAD" 2>/dev/null)
r=$(git rev-list --count "HEAD..@{upstream}" 2>/dev/null)
[ "${a:-0}" -gt 0 ] && g="${g}⇡$a"
[ "${r:-0}" -gt 0 ] && g="${g}⇣$r"
printf '%s %s' "$b" "$g"
'''
format = '[](fg:peach bg:yellow)[$output ](fg:crust bg:yellow)[](fg:yellow)'

# yellow powerline cap when outside a repo
[custom.git_sep]
when = '! git rev-parse --is-inside-work-tree >/dev/null 2>&1'
format = '[](fg:yellow)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
format = " in $duration "
style = "bg:lavender"
disabled = false
min_time = 10000
show_notifications = false
min_time_to_notify = 45000

